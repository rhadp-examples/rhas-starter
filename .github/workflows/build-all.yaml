name: build container
on:
  workflow_dispatch:

  push:
    branches:
      - 'main'
    paths:
      - 'containers/**'

jobs:
  build-rhas-starter:
    uses: ./.github/workflows/build.yaml
    with:
      container_name: rhas-starter
    secrets: inherit
    permissions:
      packages: write
      contents: read
      id-token: write
      attestations: write
