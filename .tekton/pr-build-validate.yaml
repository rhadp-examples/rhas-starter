apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: pr-test
  annotations:
    # pipeline tasks
    pipelinesascode.tekton.dev/task: "[git-clone]"
    pipelinesascode.tekton.dev/task-1: ".tekton/tasks/bash.yaml"
    pipelinesascode.tekton.dev/task-2: ".tekton/tasks/jmp-setup-client.yaml"
    pipelinesascode.tekton.dev/task-3: ".tekton/tasks/jmp-get-lease.yaml"
    pipelinesascode.tekton.dev/task-4: ".tekton/tasks/jmp-release-lease.yaml"
    pipelinesascode.tekton.dev/task-5: ".tekton/tasks/jmp-cleanup.yaml"
    
    # pipeline events
    pipelinesascode.tekton.dev/on-event: "[push,pull_request]"
    pipelinesascode.tekton.dev/on-target-branch: "[main, release]"
    
    #pipelinesascode.tekton.dev/on-path-changed: "[src/**]"
    pipelinesascode.tekton.dev/cancel-in-progress: "true"
spec:
  params:
    # git repository (PAC template vars)
    - name: repo_url
      value: "{{ repo_url }}"
    - name: revision
      value: "{{ revision }}"
    - name: sender
      value: "{{ sender }}"

  podTemplate:
    nodeSelector:
      auto.node-role/builder: "true"
    #tolerations:
    #  - key: "architecture"
    #    operator: "equal"
    #    value: "arm"
    #    effect: "NoSchedule"

  pipelineSpec:
    params:
      # git repository (PAC template vars)
      - name: repo_url
      - name: revision
      - name: sender

      # jumpstarter client config
      - name: namespace
        default: auto-jumpstarter
      - name: name
        default: rhas-starter
      - name: exporter-labels
        type: array
        default:
          - "device=test-device"
      - name: lease-timeout
        default: "3600"
      - name: lease-duration
        default: "00:20:00"

    workspaces:
      - name: shared-workspace

    tasks:
      - name: setup
        taskRef:
          name: jmp-setup-client
        #runAfter:
        #  - clone-repo
        params:
          - name: client-name
            value: $(params.sender)
          - name: namespace
            value: $(params.namespace)
        workspaces:
          - name: config-dir
            workspace: shared-workspace

      - name: get-lease
        taskRef:
          name: jmp-get-lease
        runAfter:
          - setup
        params:
          - name: client-name
            value: $(tasks.setup.results.jmp-client-name)
          - name: exporter-labels
            value: $(params.exporter-labels[*])
          - name: timeout
            value: $(params.lease-timeout)
          - name: lease-duration
            value: $(params.lease-duration)
        workspaces:
          - name: config-dir
            workspace: shared-workspace

    finally:
      - name: cleanup
        taskRef:
          name: jmp-cleanup
        params:
          - name: client-name
            value: $(tasks.setup.results.jmp-client-name)
          - name: jmp-lease-id
            value: $(tasks.get-lease.results.jmp-lease-id)
          - name: namespace
            value: $(params.namespace)
        workspaces:
          - name: config-dir
            workspace: shared-workspace
    
  workspaces:
    - name: shared-workspace
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 4Gi
