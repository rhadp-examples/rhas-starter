kind: Task
apiVersion: tekton.dev/v1beta1
metadata:
  name: jmp-setup-client
spec:
  description: |
    Create Jumpstarter client config from the user system account in Kubernetes,
    this requires that Jumpstarter is configured to trust authentication from K8s
  params:
    - name: client-name
      type: string
      description: The client intending to acquire the lease.
      default: "default"
    - name: namespace
      description: "The namespace where the Jumpstarter server is running"
      type: string
      default: "auto-jumpstarter"
    
  #results:
  #  - name: grpc-endpoint
  #    description: "The Jumpstarter grpc endpoint"
  #    type: string
  #  - name: config-path
  #    description: "Path to the generated Jumpstarter client config file"
  #    type: string

  steps:
    - name: setup-client
      image: ghcr.io/rhadp/runtime:latest
      env:
      - name: JMP_GRPC_ENDPOINT
        valueFrom:
          configMapKeyRef:
            name: jumpstarter-devspaces-config
            key: JUMPSTARTER_GRPC_ENDPOINT
      - name: JMP_CLIENT_CONFIG
        valueFrom:
          secretKeyRef:
            name: rhas-client-config
            key: jmp.config

      script: |
        #!/usr/bin/env bash
        set -x
        source /venv/bin/activate

        # normalization for used in jumpstarter/kubernetes
        CLIENT_NAME="$(echo $(params.client-name) | tr '[:upper:]' '[:lower:]' | sed 's/[^a-zA-Z0-9-]/-/g; s/-\+/-/g; s/^-//; s/-$//' | cut -c1-63)-pac"
        if oc get client "$CLIENT_NAME" -n $(params.namespace) &>/dev/null; then
          oc delete client "$CLIENT_NAME" -n $(params.namespace) &>/dev/null || true
        fi

        # setup the jmp infrastructure
        CONFIG_DIR="/root/.config/jumpstarter/clients"
        CONFIG_FILE="$CONFIG_DIR/$CLIENT_NAME.yaml"

        # Create the config directory if it doesn't exist and write the config content to a file
        mkdir -p "$CONFIG_DIR"

        # create the client config
        jmp admin create client $CLIENT_NAME --insecure-tls --unsafe --nointeractive -n $(params.namespace) --oidc-username keycloak:$(params.client-name) -out $CONFIG_FILE

        ls -la $CONFIG_DIR
  
  workspaces:
    - name: config-dir
      description: Workspace for mounting Jumpstarter client configuration
      mountPath: /root/.config/jumpstarter/clients