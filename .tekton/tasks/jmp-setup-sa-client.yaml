kind: Task
apiVersion: tekton.dev/v1beta1
metadata:
  name: jmp-setup-sa-client
spec:
  description: |
    Create Jumpstarter client config from the user system account in Kubernetes,
    this requires that Jumpstarter is configured to trust authentication from K8s
  params:
    - name: namespace
      description: "The namespace where the Jumpstarter server is running"
      type: string
    - name: name
      description: "The Jumpstarter client name"
      type: string

  results:
    - name: grpc-endpoint
      description: "The Jumpstarter grpc endpoint"
      type: string
    - name: config-path
      description: "Path to the generated Jumpstarter client config file"
      type: string

  steps:
    - name: setup-client
      image: ghcr.io/rhadp/runtime:latest
      env:
      - name: JMP_GRPC_ENDPOINT
        valueFrom:
          configMapKeyRef:
            name: jumpstarter-devspaces-config
            key: JUMPSTARTER_GRPC_ENDPOINT
      - name: JMP_CLIENT_CONFIG
        valueFrom:
          secretKeyRef:
            name: rhas-client-config
            key: jmp.config

      script: |
        #!/usr/bin/env bash
        set -x
        source /venv/bin/activate

        # setup the .kube correctly

        # Extract the values from the service account
        POD_TOKEN_FILE="/var/run/secrets/kubernetes.io/serviceaccount/token"
        POD_TOKEN=$(cat "$POD_TOKEN_FILE")
        NAMESPACE=$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)
        API_SERVER=$(oc whoami --show-server)

        # set ./kube/config correctly
        mkdir -p ~/.kube

        oc config set-cluster rhas \
          --server=$API_SERVER \
          --certificate-authority=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt

        oc config set-credentials rhas-setup \
          --token=$POD_TOKEN

        oc config set-context rhas-setup-ctx \
          --cluster=rhas \
          --user=rhas-setup \
          --namespace=$NAMESPACE

        oc config use-context rhas-setup-ctx

        # setup the jmp infrastructure
        CONFIG_DIR=$(workspaces.config-dir.path)/.config/jumpstarter/clients
        mkdir -p $CONFIG_DIR
        CONFIG_FILE="$CONFIG_DIR/$(params.name).yaml"

        printf '%s\n' "$JMP_CLIENT_CONFIG" > "$CONFIG_FILE"

        cat "$CONFIG_FILE"

        # return the config
        echo ${CONFIG_FILE} > $(results.config-path.path)
        echo $JMP_GRPC_ENDPOINT > $(results.grpc-endpoint.path)
  
  workspaces:
    - name: config-dir
      description: The workspace which contains Jumpstarter client config file