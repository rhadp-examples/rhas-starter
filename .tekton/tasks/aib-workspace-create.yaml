kind: Task
apiVersion: tekton.dev/v1beta1
metadata:
  name: aib-workspace-create
spec:
  description: |
     Exceute caib commands.
  params:
    - name: client-name
      type: string
      description: "The jumpstarter client config"
      default: "default"
    - name: workspace
      description: "Name of the workspace"
      type: string
    - name: extra-args
      description: "Additional args to add to the caib parameters"
      type: string
      default: ""
    - name: auto-sync
      type: string
      default: "false"

  steps:
    - name: setup
      image: ghcr.io/rhadp/builder:latest
      script: |
        #!/usr/bin/env bash
        set +eux

        source /venv/bin/activate
        cd /workspace/source

        # The git-clone task runs as a different (non-root) UID than this
        # step's image, so git refuses to operate on the checkout here
        # ("detected dubious ownership") unless we mark it as safe.
        git config --global --add safe.directory /workspace/source

        # Extract the values from the service account and params
        NAMESPACE=$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)
        CLIENT_NAME=$(echo "$(params.client-name)" | tr -d '[:space:]')

        # create the config loaction if it does not already exist
        CONFIG_DIR="/opt/app-root/.config/jumpstarter/clients"
        mkdir -p $CONFIG_DIR

        # write the jumpstarter config to the expected location
        echo "$(oc -n $NAMESPACE get secret $CLIENT_NAME -o jsonpath='{.data.config}' | base64 -d)" > "$CONFIG_DIR/$CLIENT_NAME.yaml"

        # Use the client name provided in the parameter
        jmp config client use $CLIENT_NAME

        # Set the Jumpstarter environment variables
        export JMP_CLIENT_CONFIG="$CONFIG_DIR/$CLIENT_NAME.yaml"

        # check the status of the workspace
        caib status

        # create the workspace
        WORKSPACE=$(echo "$(params.workspace)" | tr -d '[:space:]')
        caib workspace create $WORKSPACE $(params.extra-args)
        
        # sync source to workspace
        caib workspace sync $(params.workspace)

  workspaces:
    - name: source
      description: The workspace where the source code is located